<svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- wallpaper backdrop -->
  <rect x="0" y="0" width="380" height="380" rx="0" fill="#3a4a63"/>
  <rect x="0" y="0" width="380" height="380" fill="url(#g)"/>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4b6585"/>
    <stop offset="1" stop-color="#2d3a4f"/>
  </linearGradient>

  <!-- menu bar -->
  <rect x="0" y="0" width="380" height="26" fill="#f6f6f6" fill-opacity="0.92"/>
  <line x1="0" y1="26" x2="380" y2="26" stroke="#00000022" stroke-width="1"/>
  <!-- a couple of faint neighbour status glyphs -->
  <circle cx="262" cy="13" r="2.2" fill="#3c3c3c" fill-opacity="0.45"/>
  <path d="M280 9 l6 4 -6 4 z" fill="#3c3c3c" fill-opacity="0.45"/>
  <text x="364" y="17" text-anchor="end" font-size="11.5" fill="#3c3c3c" fill-opacity="0.5">9:41</text>

  <!-- selected status item (blue highlight, white pianokeys glyph) -->
  <rect x="300" y="2" width="26" height="22" rx="4" fill="#3970e0"/>
  <g stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linejoin="round">
    <rect x="305" y="6.5" width="16" height="13" rx="2"/>
    <line x1="310.3" y1="6.5" x2="310.3" y2="19.5"/>
    <line x1="315.7" y1="6.5" x2="315.7" y2="19.5"/>
  </g>
  <g fill="#ffffff">
    <rect x="308.2" y="6.5" width="2.2" height="7" rx="0.6"/>
    <rect x="313.6" y="6.5" width="2.2" height="7" rx="0.6"/>
  </g>

  <!-- dropdown menu -->
  <g filter="url(#shadow)">
    <rect x="58" y="30" width="314" height="270" rx="10" fill="#fbfbfb" fill-opacity="0.99" stroke="#00000018" stroke-width="1"/>
  </g>

  <!-- column helpers: checkmark x=78, text x=92 -->
  <g font-size="13" fill="#1d1d1f">
    <!-- header (disabled) -->
    <text x="92" y="50" font-size="12.5" fill="#9a9a9e">Version 2.1 (build 5)</text>
    <line x1="68" y1="60" x2="362" y2="60" stroke="#0000001a" stroke-width="1"/>

    <!-- pause group (enabled, no state) -->
    <text x="92" y="78">Pause</text>
    <text x="92" y="102">Pause if no player is running</text>
    <line x1="68" y1="112" x2="362" y2="112" stroke="#0000001a" stroke-width="1"/>

    <!-- priority group -->
    <path d="M75 127 l3.4 3.6 6.4 -7.4" stroke="#1d1d1f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="130">Send events to both players</text>
    <text x="92" y="154">Prioritize Music</text>
    <text x="92" y="178">Prioritize Spotify</text>
    <line x1="68" y1="188" x2="362" y2="188" stroke="#0000001a" stroke-width="1"/>

    <!-- login item (checked) -->
    <path d="M75 203 l3.4 3.6 6.4 -7.4" stroke="#1d1d1f" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="206">Open at login</text>
    <line x1="68" y1="216" x2="362" y2="216" stroke="#0000001a" stroke-width="1"/>

    <!-- footer actions -->
    <text x="92" y="234">Donate if you like the app</text>
    <text x="92" y="258">Check for updates</text>
    <text x="92" y="282">Quit</text>
  </g>
</svg>
